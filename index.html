<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rellotge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  /* ---------- temes (canvia amb ?tema=rosa | blanc | fosc) ---------- */
  :root{
    --card:#F48FB1;      /* targeta */
    --card2:#F7A6C2;     /* meitat de dalt, una mica més clara */
    --ink:#B0185A;       /* números */
    --line:rgba(255,255,255,.55);
    --shadow:rgba(176,24,90,.18);
  }
  body.blanc{ --card:#F4F4F2; --card2:#FAFAF9; --ink:#3A3A3A; --line:rgba(0,0,0,.08); --shadow:rgba(0,0,0,.08); }
  body.fosc { --card:#2B2B2F; --card2:#34343A; --ink:#F7A6C2; --line:rgba(255,255,255,.08); --shadow:rgba(0,0,0,.35); }

  html,body{ margin:0; height:100%; background:transparent; }
  body{ display:flex; align-items:center; justify-content:center; font-family:"Anton", Impact, "Arial Narrow Bold", sans-serif; overflow:hidden; }

  .clock{ display:flex; gap:3vmin; width:94vw; max-width:900px; aspect-ratio: 2.1 / 1; }
  .card{
    position:relative; flex:1; border-radius:3.2vmin; overflow:hidden;
    background:linear-gradient(var(--card2) 0 50%, var(--card) 50% 100%);
    box-shadow:0 1.2vmin 3vmin var(--shadow);
    display:flex; align-items:center; justify-content:center;
  }
  .card::after{ /* línia del mig, com un rellotge de paletes */
    content:""; position:absolute; left:0; right:0; top:50%; height:.45vmin; background:var(--line);
  }
  .num{
    color:var(--ink); font-size:min(44vmin, 23vw); line-height:1; letter-spacing:-.02em;
    transform-origin:50% 50%; margin-top:-4%;
  }
  .num.flip{ animation:flip .5s ease; }
  @keyframes flip{ 0%{ transform:rotateX(0) } 45%{ transform:rotateX(85deg); opacity:.4 } 100%{ transform:rotateX(0); opacity:1 } }
  .lab{ position:absolute; bottom:6%; color:var(--ink); font-size:min(5.2vmin, 3vw); letter-spacing:.04em; text-transform:uppercase; }
  .lab.l{ left:7%; } .lab.r{ right:7%; }
  @media (prefers-reduced-motion: reduce){ .num.flip{ animation:none } }
</style>
</head>
<body>
  <div class="clock" role="img" aria-label="Rellotge">
    <div class="card"><span class="num" id="h">00</span><span class="lab l" id="ll"></span></div>
    <div class="card"><span class="num" id="m">00</span><span class="lab r" id="lr"></span></div>
  </div>

<script>
/* Opcions a l'enllaç:
   ?tema=rosa | blanc | fosc        (per defecte: rosa)
   ?idioma=ca | es | en             (per defecte: ca)
   ?format=24 | 12                  (per defecte: 24)            */
const q = new URLSearchParams(location.search);
const tema = q.get('tema') || 'rosa';
const idioma = q.get('idioma') || 'ca';
const fmt12 = q.get('format') === '12';
if (tema !== 'rosa') document.body.classList.add(tema);

const DIES = {
  ca:['diumenge','dilluns','dimarts','dimecres','dijous','divendres','dissabte'],
  es:['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],
  en:['sunday','monday','tuesday','wednesday','thursday','friday','saturday']
};
const MESOS = {
  ca:['gen','febr','març','abr','maig','juny','jul','ag','set','oct','nov','des'],
  es:['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'],
  en:['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec']
};
const pad = n => String(n).padStart(2,'0');
const els = { h:document.getElementById('h'), m:document.getElementById('m'), ll:document.getElementById('ll'), lr:document.getElementById('lr') };

function set(el, v){
  if (el.textContent === v) return;
  el.textContent = v;
  el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip');
}
function tick(){
  const d = new Date();
  let h = d.getHours();
  if (fmt12){ els.ll.textContent = h < 12 ? 'AM' : 'PM'; h = h % 12 || 12; }
  else { els.ll.textContent = d.getDate() + ' ' + (MESOS[idioma] || MESOS.ca)[d.getMonth()]; }
  set(els.h, pad(h));
  set(els.m, pad(d.getMinutes()));
  els.lr.textContent = (DIES[idioma] || DIES.ca)[d.getDay()];
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
